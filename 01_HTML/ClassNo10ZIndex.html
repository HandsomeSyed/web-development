<!-- Z-Index   -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            position: relative; 
           
        }
        .Box1{
            border: 1px solid;
            width: 50%;
            height: 200px;
            background-color: rgb(9, 203, 225);
            z-index: -1;
            position: absolute;
        }
        .Box2{
            border: 1px solid;
            width: 30%;
            height: 130px;
            
            background-color:  rgb(49, 146, 146);
            z-index: -2;
            position: absolute;
        }
            /* POSOTION PROPERTY  : */
        .Box3{
            border: 1px solid;
            width: 20%;
            height: 100px;
           margin-top: -100px;
           z-index: -3;
           position: relative;
        }
    </style>
 </head>
 <body>
    <div class="container">
        <div class="Box1">
            Box 1
        </div>

        <div class="Box2">
            Box 2
        </div>

        <div class="Box3">
            Box 3
        </div>

    </div>
 </body>
 </html>
