<!DOCTYPE html>
<!-- div Tag -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev tag in HTML</title>
    <!-- fload : fix size
     display :
     -->
     <!--border radious : is used to round the sides of box 
      border-radious:10px 20px 0px 30px;
      it mean from top lift 10 top right 20
      bottom lift 0px bottom right 30px -->
    <style>
        .paragraph{
            border: solid;
        }
        .div1{
            border: 1px solid;
        }
        .Department{
            border: 1px solid;
            width: 280px;
            height: 200px;
            float: left;
            border-radius: 20px;
            padding: 10px
        }
        #div3{
            border: 1px solid green;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            
        }
    </style>
</head>
   
<body>
    <!-- div Tag : it is used to divide the webpage in diffrent parts . mean division and it 
     is a block tag 
     span : it is a inline tag  -->
   <p class="paragraph">
    this is a paragraph in html
   </p>
   <span class="paragraph">
    this is a paragraph in html
   </span>
   <div class="div1">
    this is div ....
   </div>
     <br></br>
     <!-- nested tag : div inside div  -->
   <div class="Department">
    Computer Science ....
   </div>
   <div class="Department">
    English ....
   </div>
   <div class="Department">
    Urdu ....
   </div>
   <div class="Department">
    Botany ....
   </div>
   <br><br><br><br><br><br><br><br><br><br><br><br><br><br>

   <div id="div3"> div

   </div>
   

    
</body>
</html>
